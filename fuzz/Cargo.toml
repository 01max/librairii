[package]
name = "librairii-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99.1"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]
resolver = "3"

[dependencies]
libfuzzer-sys = "=0.4.13"
librairii-adapters = { path = "../crates/librairii-adapters", version = "=0.0.0" }
librairii-app = { path = "../crates/librairii-app", version = "=0.0.0" }
librairii-core = { path = "../crates/librairii-core", version = "=0.0.0" }

[[bin]]
name = "identity"
path = "fuzz_targets/identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_boundaries"
path = "fuzz_targets/import_boundaries.rs"
test = false
doc = false
bench = false

[patch.crates-io]
sevenz-turbo = { path = "../third_party/sevenz-turbo" }
