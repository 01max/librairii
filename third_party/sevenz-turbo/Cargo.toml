[dependencies.aes]
version = "0.9"
features = ["zeroize"]
optional = true

[dependencies.aws-lc-rs]
version = "1.18"
features = [
    "aws-lc-sys",
    "prebuilt-nasm",
]
optional = true
default-features = false

[dependencies.brotli]
version = ">= 7, < 10"
features = ["std"]
optional = true
default-features = false

[dependencies.bzip2]
version = "0.6"
optional = true

[dependencies.cbc]
version = "0.2"
optional = true

[dependencies.flate2]
version = "1"
features = ["zlib-rs"]
optional = true

[dependencies.getrandom]
version = "0.4"
optional = true

[dependencies.lz4_flex]
version = "0.14"
optional = true

[dependencies.lzma-turbo]
version = "0.10.2"
features = [
    "std",
    "asm",
    "crc",
    "filters",
]
default-features = false

[dependencies.nt-time]
version = "0.15"
optional = true

[dependencies.ppmd-turbo]
version = "0.2.0"
optional = true

[dependencies.zeroize]
version = "1.9"
features = ["alloc"]

[dependencies.zstd]
version = "0.14"
optional = true

[dev-dependencies.rand]
version = "0.10"

[dev-dependencies.tempfile]
version = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cap-std]
version = "4.0.3"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(sevenz_turbo_unthreaded)"]

[profile.dev.package.lzma-turbo]
opt-level = 3

[profile.dev.package.ppmd-turbo]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1

[profile.test]
debug = 0
split-debuginfo = "off"
incremental = false
