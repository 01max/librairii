[package]
edition = "2024"
rust-version = "1.97.1"
name = "sevenz-turbo"
version = "0.29.2"
build = false
exclude = [
    ".github/",
    ".githooks/",
    ".gitleaks.toml",
    ".gitattributes",
    "renovate.json",
    "AGENTS.md",
    ".cargo/",
    "xtask/",
    "rust-toolchain.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rust based 7z decompressor/compressor; a fork of sevenz-rust2 that focuses on raw speed and streaming consumers"
homepage = "https://github.com/scryer-media/sevenz-turbo"
readme = "README.md"
keywords = [
    "7z",
    "7zip",
    "sevenz",
    "decompress",
]
license = "Apache-2.0"
repository = "https://github.com/scryer-media/sevenz-turbo"

[package.metadata.docs.rs]
all-features = true

[features]
aes256 = ["dep:getrandom"]
aes256_wasm = [
    "aes256",
    "getrandom/wasm_js",
]
aws-lc-crypto = [
    "dep:aws-lc-rs",
    "lzma-turbo/crypto",
]
brotli = ["dep:brotli"]
bzip2 = ["dep:bzip2"]
compress = ["lzma-turbo/enc"]
crc-host = ["lzma-turbo/crc-host"]
crypto-host = ["lzma-turbo/crypto-host"]
default = [
    "aes256",
    "aws-lc-crypto",
    "bzip2",
    "compress",
    "ppmd",
    "util",
]
default_wasm = [
    "aes256_wasm",
    "native-crypto",
    "bzip2",
    "compress",
    "ppmd",
    "util",
]
deflate = ["dep:flate2"]
kernel-ab = ["lzma-turbo/kernel-ab"]
lz4 = ["dep:lz4_flex"]
native-crypto = [
    "dep:aes",
    "dep:cbc",
    "lzma-turbo/native-crypto",
]
nt-time = ["dep:nt-time"]
ppmd = ["dep:ppmd-turbo"]
util = ["dep:cap-std"]
zstd = ["dep:zstd"]

[lib]
name = "sevenz_turbo"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

