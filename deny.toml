[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
git-fetch-with-cli = true
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "NCSA", "ISC", "BSD-3-Clause"]
confidence-threshold = 0.9
exceptions = []

# Product licensing is undecided. Do not manufacture a license for unpublished
# local members; all upstream production AND development dependencies are checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = ["getrandom@0.2.17", "miniz_oxide@0.8.9"]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
