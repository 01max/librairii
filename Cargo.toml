[workspace]
members = ["crates/*", "xtask"]
exclude = ["fuzz", "qualification/section-2", "third_party/sevenz-turbo", "third_party/accesskit-atspi-common", "third_party/accesskit-unix", "third_party/fontique", "third_party/slint-backend-winit"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
librairii-core = { version = "=0.0.0", path = "crates/librairii-core" }
librairii-app = { version = "=0.0.0", path = "crates/librairii-app" }
librairii-storage = { version = "=0.0.0", path = "crates/librairii-storage" }
librairii-adapters = { version = "=0.0.0", path = "crates/librairii-adapters" }
librairii-ui = { version = "=0.0.0", path = "crates/librairii-ui" }
librairii-desktop = { version = "=0.0.0", path = "crates/librairii-desktop" }
librairii-testkit = { version = "=0.0.0", path = "crates/librairii-testkit" }
uuid = { version = "=1.28.0", default-features = false, features = ["std"] }
thiserror = "=2.0.21"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }
sha2 = { version = "=0.11.1", default-features = false, features = [] }
windows-sys = { version = "=0.61.2", default-features = false, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_WindowsProgramming"] }

tempfile = "=3.27.0"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"

proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
insta = { version = "=1.49.0", default-features = false, features = ["json"] }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

time = { version = "=0.3.55", default-features = false, features = ["std", "parsing", "formatting"] }

reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }
mime = "=0.3.17"
rustls-platform-verifier = "=0.7.1"

image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rawzip = "=0.5.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
sevenz-turbo = { version = "=0.29.2", default-features = false, features = ["bzip2", "ppmd", "deflate", "zstd", "lz4", "brotli"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "accessibility", "backend-winit-x11", "backend-winit-wayland", "renderer-skia", "raw-window-handle-06", "unstable-winit-030"] }
html5ever = "=0.40.1"
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[patch.crates-io]
sevenz-turbo = { path = "third_party/sevenz-turbo" }
accesskit_atspi_common = { path = "third_party/accesskit-atspi-common" }
accesskit_unix = { path = "third_party/accesskit-unix" }
fontique = { path = "third_party/fontique" }
i-slint-backend-winit = { path = "third_party/slint-backend-winit" }

# Native renderer symbols are supplied by reviewed upstream libraries. Keep the
# routine multi-target build small enough for the native CI host disk budget.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Native UI observers exercise the full callback/capture suite within a fixed
# deadline on all three hosts. Retain development assertions and overflow checks.
[profile.native-observer]
inherits = "dev"
opt-level = 1
debug-assertions = true
overflow-checks = true
