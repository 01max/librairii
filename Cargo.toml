[workspace]
members = ["crates/*", "xtask"]
exclude = ["fuzz", "qualification/section-2"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
librairii-core = { path = "crates/librairii-core" }
librairii-app = { path = "crates/librairii-app" }
librairii-storage = { path = "crates/librairii-storage" }
librairii-adapters = { path = "crates/librairii-adapters" }
librairii-ui = { path = "crates/librairii-ui" }
librairii-desktop = { path = "crates/librairii-desktop" }
librairii-testkit = { path = "crates/librairii-testkit" }
