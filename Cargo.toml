[workspace]
members = ["crates/*", "xtask"]
exclude = ["fuzz", "qualification/section-2"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
librairii-core = { path = "crates/librairii-core" }
librairii-app = { path = "crates/librairii-app" }
librairii-storage = { path = "crates/librairii-storage" }
librairii-adapters = { path = "crates/librairii-adapters" }
librairii-ui = { path = "crates/librairii-ui" }
librairii-desktop = { path = "crates/librairii-desktop" }
librairii-testkit = { path = "crates/librairii-testkit" }
uuid = { version = "=1.28.0", default-features = false, features = ["std"] }
thiserror = "=2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
