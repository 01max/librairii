version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    reviewers:
      - "01max"
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - "01max"
    labels: [dependencies, rust]
    # Path dependencies inherit the root pins; update both lockfiles together.
    groups:
      shared-rust-dependencies:
        group-by: dependency-name
