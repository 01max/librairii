name: Intel input diagnosis

on:
  pull_request:
    paths:
      - '.github/workflows/intel-input-diagnostic.yml'
      - 'qualification/section-17/intel-input-diagnostic.py'
      - 'qualification/section-17/input-probe-macos.swift'
      - 'qualification/section-17/native-input-phases.py'
      - 'qualification/section-17/input-phases-macos.swift'
      - 'qualification/section-17/native-startup-diagnostic.py'
      - 'qualification/section-17/native-input-replay.py'
      - 'qualification/section-17/native-startup-profile.py'
      - 'qualification/section-17/native-startup-phases.py'
      - 'qualification/section-17/native-pointer-phases.py'
      - 'qualification/section-17/native-font-phases.py'
  workflow_dispatch:
    inputs:
      probe:
        description: Bounded diagnostic to execute
        required: true
        default: dispatch
        type: choice
        options: [input, startup, startup-late-first, startup-profile, startup-phases, startup-fonts, input-replay, pointer, dispatch]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the workspace-pinned compiler
        if: github.event.inputs.probe == 'input' || github.event.inputs.probe == 'pointer' || github.event.inputs.probe == 'dispatch' || startsWith(github.event.inputs.probe, 'startup-f') || github.event.inputs.probe == 'startup-phases' || github.event_name == 'pull_request'
        run: |
          pin="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$pin" --profile minimal
      - name: Reuse exact-dependency release build inputs
        if: github.event.inputs.probe == 'input' || github.event.inputs.probe == 'pointer' || github.event.inputs.probe == 'dispatch' || startsWith(github.event.inputs.probe, 'startup-f') || github.event.inputs.probe == 'startup-phases' || github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: intel-input-phases-v1-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/x86_64-apple-darwin/release/
      - name: Trace actual callback and observer publication boundaries
        if: github.event.inputs.probe == 'input'
        run: python3 -I -B qualification/section-17/native-input-phases.py
      - name: Replay a fixed set of instrumented input workloads
        if: github.event.inputs.probe == 'input-replay'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B qualification/section-17/native-input-replay.py
      - name: Compare startup observer activation with retained product bytes
        if: github.event.inputs.probe == 'startup'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B qualification/section-17/native-startup-diagnostic.py
      - name: Check the complementary startup activation order
        if: github.event.inputs.probe == 'startup-late-first'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B qualification/section-17/native-startup-diagnostic.py --late-first
      - name: Profile two owned startup processes
        if: github.event.inputs.probe == 'startup-profile'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B qualification/section-17/native-startup-profile.py
      - name: Trace in-memory toolkit, component, menu and timer phases
        if: github.event.inputs.probe == 'startup-phases'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B qualification/section-17/native-startup-phases.py
      - name: Trace the pinned font discovery inside actual platform setup
        if: github.event.inputs.probe == 'startup-fonts'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B qualification/section-17/native-font-phases.py
      - name: Trace the actual browser-focus acknowledgement for each pointer sample
        if: github.event.inputs.probe == 'pointer'
        run: python3 -I -B qualification/section-17/native-pointer-phases.py
      - name: Verify corrected dispatch with the complete standalone input workload
        if: github.event.inputs.probe == 'dispatch' || github.event_name == 'pull_request'
        env:
          RUST_TARGET: x86_64-apple-darwin
        run: |
          mkdir -p target/quality/native-scale
          python3 -I -B qualification/section-16/test_dispatch.py
          python3 -I -B scripts/verify-native-interaction.py
      - name: Retain all diagnostic cohorts, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intel-${{ github.event.inputs.probe || 'dispatch' }}-diagnostic-${{ github.sha }}
          path: ${{ (github.event.inputs.probe == 'dispatch' || github.event_name == 'pull_request') && 'target/quality/native-scale/desktop/' || github.event.inputs.probe == 'pointer' && 'target/intel-pointer-phases/' || (github.event.inputs.probe == 'startup-phases' || github.event.inputs.probe == 'startup-fonts') && 'target/intel-startup-phases/' || startsWith(github.event.inputs.probe, 'startup') && 'target/intel-startup-diagnostic/' || github.event.inputs.probe == 'input-replay' && 'target/intel-input-replay/' || 'target/intel-input-phases/' }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
