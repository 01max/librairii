name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select Go/Wails checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      legacy: ${{ steps.paths.outputs.legacy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the changed-path decision
        run: python3 -I -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select legacy suites from the complete local diff
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 -I -B .github/scripts/legacy-ci-changes.py

  verify:
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make setup

      - name: Verify
        run: make check

      - name: Build Wails application
        run: make build

  linux-amd64:
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    name: Linux amd64 release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails and virtual desktop dependencies
        run: |
          .github/scripts/ubuntu-apt \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            xauth \
            dbus-x11 \
            desktop-file-utils \
            pcmanfm \
            procps \
            xdg-utils \
            xvfb
          wails_version="$(cat .wails-version)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wails_version"

      - name: Install dependencies
        run: |
          go mod download
          npm --prefix frontend ci

      - name: Verify Linux release
        run: scripts/verify-platform-linux

      - name: Upload qualified Linux archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Librairii-linux-amd64
          path: |
            build/bin/Librairii-*-linux-amd64.tar.gz
            build/bin/Librairii-*-linux-amd64.tar.gz.sha256
          if-no-files-found: error
