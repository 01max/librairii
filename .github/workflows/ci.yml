name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24.10.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Wails CLI
        run: |
          wails_version="$(cat .wails-version)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wails_version"

      - name: Install dependencies
        run: make setup

      - name: Verify
        run: make check

      - name: Build Wails application
        run: make build
