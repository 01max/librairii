name: Instrumented startup comparison (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dependency-startup-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Intel startup comparison; no acceptance verdict
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact retained main-branch observations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13510371418'
          run-id: '42222614706'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/startup-comparison/inputs/baseline
          merge-multiple: true
      - name: Download the exact retained failed candidate observations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13516343300'
          run-id: '42229788963'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/startup-comparison/inputs/candidate
          merge-multiple: true
      - name: Verify manifests, source identities and executable hashes
        run: python3 -I -B scripts/diagnose-dependency-startup.py --input-root target/startup-comparison/inputs --verify-only
      - name: Install the exact source-pinned compiler
        shell: bash
        run: |
          pin="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$pin" --profile minimal
      - name: Restore only dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: rust-release-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
      - name: Collect every ordered observation separately from qualification
        run: python3 -I -B scripts/diagnose-dependency-startup.py --input-root target/startup-comparison/inputs --build-instrumented
      - name: Preserve complete or partial diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-startup-comparison-${{ github.sha }}
          path: target/startup-comparison/observations/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
