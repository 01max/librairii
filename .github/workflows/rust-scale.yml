name: Rust scale and resilience

on:
  pull_request:
  push:
    branches: [main, rewrite-in-rust-native-desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-scale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust scale ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RUST_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install signed Ubuntu compiler prerequisites
        if: runner.os == 'Linux'
        run: .github/scripts/ubuntu-apt build-essential pkg-config python3 clang cmake ninja-build libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev xvfb xauth xdotool dbus-x11 libvulkan1 mesa-vulkan-drivers mesa-utils python3-pyatspi at-spi2-core libglib2.0-bin sway wtype
      - uses: ./.github/actions/rust-environment
        with:
          tools: quality
      - name: Retained native backend scale gates
        run: python3 -I -B scripts/verify-native-scale.py
      - name: Retain backend measurements before native workloads
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-scale-backend-${{ matrix.target }}-${{ github.sha }}
          path: target/quality/native-scale/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Current desktop native input/loading/cache on macOS
        if: runner.os == 'macOS' && !cancelled()
        run: python3 -I -B scripts/verify-native-interaction.py
      - name: Current desktop native input/loading/cache on Linux X11
        if: runner.os == 'Linux' && !cancelled()
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24' python3 -I -B scripts/verify-native-interaction.py
      - name: Current release resource and native display gates on macOS
        if: runner.os == 'macOS' && !cancelled()
        run: python3 -I -B scripts/verify-native-resources.py
      - name: Current release resource and native display gates on Linux
        if: runner.os == 'Linux' && !cancelled()
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24' python3 -I -B scripts/verify-native-resources.py
      - name: Retain source-bound raw measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-scale-${{ matrix.target }}-${{ github.sha }}
          path: target/quality/native-scale/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Compare first-page query plans after acceptance workloads
        id: query_plan
        if: always() && !cancelled()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir target/query-plan-experiment
          cp target/quality/native-scale/manifest.json target/query-plan-experiment/backend-manifest.json
          python3 -I -B - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          destination = Path('target/query-plan-experiment')
          manifest = json.loads((destination / 'backend-manifest.json').read_bytes())
          binary = Path('target/quality/native-scale/scale-backend')
          def identity():
              source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              if subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=normal']):
                  raise ValueError('diagnostic requires clean source')
              raw = binary.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if (source != manifest['source_commit'] or digest != manifest['executable']['sha256']
                      or len(raw) != manifest['executable']['bytes']):
                  raise ValueError('diagnostic executable/source differs from retained backend')
              return {'source_commit': source, 'target': manifest['target'],
                      'executable_sha256': digest, 'executable_bytes': len(raw)}
          before = identity()
          (destination / 'identity-before.json').write_text(json.dumps(before, indent=2) + '\n')
          try:
              with (destination / 'report.json').open('w') as report, (destination / 'stderr.log').open('w') as log:
                  subprocess.run([str(binary), '--query-diagnostics'], stdout=report, stderr=log,
                                 check=True, timeout=180)
          finally:
              after = identity()
              (destination / 'identity-after.json').write_text(json.dumps(after, indent=2) + '\n')
              if before != after:
                  raise ValueError('diagnostic identity changed during execution')
          PY
      - name: Record diagnostic outcome separately from acceptance
        if: always()
        env:
          QUERY_PLAN_OUTCOME: ${{ steps.query_plan.outcome }}
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          destination = Path('target/query-plan-experiment')
          destination.mkdir(exist_ok=True)
          (destination / 'status.json').write_text(json.dumps({
              'outcome': os.environ['QUERY_PLAN_OUTCOME'], 'acceptance_evidence': False,
              'causal_fix_proven': False}, indent=2) + '\n')
          PY
      - name: Retain separate query-plan experiment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-plan-experiment-${{ matrix.target }}-${{ github.sha }}
          path: target/query-plan-experiment/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
