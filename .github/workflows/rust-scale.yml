name: Rust scale and resilience

on:
  pull_request:
  push:
    branches: [main, rewrite-in-rust-native-desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-scale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust scale ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RUST_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install signed Ubuntu compiler prerequisites
        if: runner.os == 'Linux'
        run: .github/scripts/ubuntu-apt build-essential pkg-config python3 clang cmake ninja-build libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev xvfb xauth xdotool dbus-x11 libvulkan1 mesa-vulkan-drivers mesa-utils python3-pyatspi at-spi2-core libglib2.0-bin sway wtype
      - uses: ./.github/actions/rust-environment
        with:
          tools: quality
      - name: Retained native backend scale gates
        run: python3 -I -B scripts/verify-native-scale.py
      - name: Current desktop native input/loading/cache on macOS
        if: runner.os == 'macOS' && !cancelled()
        run: python3 -I -B scripts/verify-native-interaction.py
      - name: Current desktop native input/loading/cache on Linux X11
        if: runner.os == 'Linux' && !cancelled()
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24' python3 -I -B scripts/verify-native-interaction.py
      - name: Current release resource and native display gates on macOS
        if: runner.os == 'macOS' && !cancelled()
        run: python3 -I -B scripts/verify-native-resources.py
      - name: Current release resource and native display gates on Linux
        if: runner.os == 'Linux' && !cancelled()
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24' python3 -I -B scripts/verify-native-resources.py
      - name: Retain source-bound raw measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-scale-${{ matrix.target }}-${{ github.sha }}
          path: target/quality/native-scale/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
