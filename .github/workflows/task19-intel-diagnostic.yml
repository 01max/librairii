name: Task19 Intel latency diagnostic

on:
  push:
    branches: [codex/rewrite-19-intel-scale-diagnostic]

permissions:
  contents: read
  actions: read

concurrency:
  group: task19-intel-diagnostic-${{ github.sha }}
  cancel-in-progress: false

jobs:
  replay:
    name: Retained Intel software cohort (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [control, profile]
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      RUST_TARGET: x86_64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      DIAGNOSTIC_DRIVER_SOURCE: ${{ github.sha }}
      DIAGNOSTIC_MODE: ${{ matrix.mode }}
    steps:
      - name: Check out the exact retained workload source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 22a873d47904a88e848fdbae2b4b284c10b19888
          persist-credentials: false
      - name: Check out this diagnostic driver separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: target/task19-diagnostic-driver
          persist-credentials: false
      - name: Retrieve the retained failed run without rebuilding binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: '13042959390'
          run-id: '41195747425'
          github-token: ${{ github.token }}
          path: target/task19-original-scale
          merge-multiple: true
      - name: Run original software cohort functions and retain every verdict
        run: python3 -I -B target/task19-diagnostic-driver/.github/scripts/task19-intel-replay.py
      - name: Retain all diagnostic observations including failed trials
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: task19-intel-diagnostic-${{ matrix.mode }}-${{ github.sha }}
          path: target/task19-intel-replay/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
