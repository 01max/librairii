name: Platform release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    name: Linux amd64 release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24.10.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails and virtual desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            xauth \
            dbus-x11 \
            desktop-file-utils \
            pcmanfm \
            procps \
            xdg-utils \
            xvfb
          wails_version="$(cat .wails-version)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wails_version"

      - name: Install dependencies
        run: |
          go mod download
          npm --prefix frontend ci

      - name: Verify Linux release
        run: scripts/verify-platform-linux

      - name: Upload qualified Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: Librairii-linux-amd64
          path: |
            build/bin/Librairii-*-linux-amd64.tar.gz
            build/bin/Librairii-*-linux-amd64.tar.gz.sha256
          if-no-files-found: error
