name: Rust native packages

on:
  pull_request:
  push:
    branches: [main, rewrite-in-rust-native-desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUST_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install signed Ubuntu build and package tools
        if: runner.os == 'Linux'
        run: .github/scripts/ubuntu-apt build-essential pkg-config python3 clang cmake ninja-build libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev desktop-file-utils
      - name: Install the exact source-pinned compiler
        shell: bash
        run: |
          pin="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$pin" --profile minimal
      - name: Restore only dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: rust-release-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
      - name: Check all required release custody regressions
        run: python3 -I -B xtask/run_preservation_tests.py
      - name: Build the source-bound production payload
        run: cargo xtask release build --target "$RUST_TARGET" --output target/native-release/stage
      - name: Assemble the native macOS disk image
        if: runner.os == 'macOS'
        run: cargo xtask release package-macos --stage target/native-release/stage --output target/native-release/package
      - name: Assemble the native Linux archive
        if: runner.os == 'Linux'
        run: cargo xtask release package-linux --stage target/native-release/stage --output target/native-release/package
      - name: Retain exact packages and source/build custody
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-candidate-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/native-release/stage/stage.json
            target/native-release/stage/compiler-artifacts.jsonl
            target/native-release/stage/build.log
            target/native-release/stage/inventory.log
            target/native-release/package/*.dmg
            target/native-release/package/*.tar.gz
            target/native-release/package/*.sha256
            target/native-release/package/artifact.json
            target/native-release/package/package.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  install:
    name: Inspect installed package ${{ matrix.target }}
    needs: [build]
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Official v6.0.0 signed release commit; verified through GitHub's API.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: native-candidate-${{ matrix.target }}-${{ github.sha }}
          path: target/native-release/provider
      - name: Inspect the actual installed final bytes from an unrelated directory
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: python3 -I -B scripts/native-release.py inspect-package --directory target/native-release/provider/package --expected-source "$EXPECTED_SOURCE" --target "$RUST_TARGET" --output target/native-release/inspection
      - name: Retain installation inspection independently of build success
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-installation-${{ matrix.target }}-${{ github.sha }}
          path: target/native-release/inspection/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  required:
    name: Native package inspection targets
    needs: [build, install]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse failed or missing package inspections
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
        run: test "$BUILD_RESULT" = success && test "$INSTALL_RESULT" = success
