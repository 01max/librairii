[package]
name = "librairii-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

# Separate spike workspace; section 3 owns the application workspace.
[workspace]
resolver = "3"
members = ["vendor/accesskit-atspi-common"]

[patch.crates-io]
accesskit_atspi_common = { path = "vendor/accesskit-atspi-common" }

[features]
default = []
gui = ["dep:slint", "dep:slint-build", "dep:rfd", "dep:tempfile", "dep:muda", "dep:image", "dep:raw-window-handle"]

[dependencies]
raw-window-handle = { version = "=0.6.2", optional = true }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png"] }
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-18", "accessibility", "backend-winit-x11", "backend-winit-wayland", "renderer-skia", "raw-window-handle-06", "unstable-winit-030"] }
rfd = { version = "=0.17.2", optional = true, default-features = false, features = ["xdg-portal", "wayland"] }
tempfile = { version = "=3.27.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.19.3", optional = true, default-features = false }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true, default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sevenz-rust2 = { version = "=0.24.1", default-features = false, features = ["bzip2", "ppmd", "deflate", "zstd", "lz4", "brotli"] }
tempfile = "=3.27.0"

[[bin]]
name = "qualification-desktop"
path = "src/bin/desktop.rs"
required-features = ["gui"]
